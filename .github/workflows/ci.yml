name: MTGroup VPN Ultimate CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx

      - name: Lint with ruff
        run: |
          ruff check backend/ telegram_bot/ --ignore E501

      - name: Type check with mypy
        run: |
          mypy backend/app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run API tests
        run: |
          pytest backend/tests/ -v --asyncio-mode=auto --tb=short -x

      - name: Run eBPF tests
        run: |
          pytest backend/tests/test_ebpf.py -v --asyncio-mode=auto --tb=short

      - name: Run Telegram bot tests
        run: |
          pytest telegram_bot/tests_bot.py -v --asyncio-mode=auto --tb=short

      - name: Test coverage report
        # Blocking (no continue-on-error): coverage on backend/ (excluding
        # cli.py — see .coveragerc — and test files themselves, which
        # previously inflated the reported percentage by counting
        # already-100%-covered test code as "coverage"). telegram_bot/ is
        # measured but not currently included in the gate threshold — its
        # test suite has a pre-existing relative-import failure unrelated
        # to this gate that needs fixing separately.
        # 75% is a safety margin below the real, currently-achieved ~77%
        # as of 2026-08-10. Most of the 67% -> 73% jump came from a
        # .coveragerc fix, not new tests: coverage wasn't configured to
        # follow greenlet switches, which is how SQLAlchemy's async ORM
        # bridges every awaited DB call — so most api/*.py route handler
        # code past its first `await db.execute(...)` was invisible to
        # the tracer despite being fully exercised by test_api*.py via
        # the HTTP test client (auth.py 55%->81%, nodes.py 35%->75%,
        # subscriptions.py 37%->80%, system.py 50%->95%, resellers.py
        # 46%->79%, users.py 29%->60%, zero new tests). See the comment
        # in .coveragerc for detail; do not remove `concurrency =
        # greenlet, thread` there or these numbers regress silently.
        # The rest came from real new tests: accounting.py 27%->91%
        # (also fixed a real bug found via testing: the bulk
        # traffic-accounting UPDATE threw on every single cycle under
        # SQLAlchemy 2.x and was silently swallowed, so quota suspension
        # never actually ran in production; see
        # backend/app/core/accounting.py), auto_cdn.py 0%->95%,
        # metrics.py 48%->93% (ConnectionManager broadcast/lifecycle +
        # the risk/quality scoring functions — the one genuine gap left
        # by the .coveragerc fix), and routing_engine.py 59%->90%
        # (SNIMultiplexer's connection handling, forwarding, decoy
        # deflection, tarpit, and the DPI-evasion preset generator
        # functions — also fixed a real bug found via testing:
        # `_handle_connection`'s finally-block read `sni` before Step 2
        # ever assigned it on the timeout/empty-connection early-return
        # paths, raising UnboundLocalError out of the whole coroutine and
        # skipping writer.close()/wait_closed() — a socket leak on every
        # idle or timed-out probe connection; see
        # backend/app/core/routing_engine.py). Raise this number as
        # coverage improves further, never lower it.
        run: |
          pytest backend/tests/ \
            --asyncio-mode=auto \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=75

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Security scan with bandit
        # Blocking as of 2026-08-10: 0 findings remain (down from 10).
        # Every prior finding was either fixed (the /tmp-hardcoded XDP
        # stats path moved to /run) or explicitly accepted as intentional
        # design via an inline `# nosec BXXX - reason` comment (0.0.0.0
        # binds on public-facing services, verify=False on self-signed
        # node certs backed by HMAC payload signing, the privileged
        # helper's restrictive socket chmod, the literal cls/clear shell
        # call, one test-data false positive). New findings should be
        # fixed or given the same nosec-with-reason treatment, not
        # silently reintroduced by flipping this back to non-blocking.
        run: |
          bandit -r backend/ telegram_bot/ -ll --skip B101

      - name: Check for vulnerable dependencies
        # Non-blocking: `safety check` is deprecated upstream in favour of
        # `safety scan`, and hasn't been verified against a clean venv
        # (only checked ad hoc against a dev machine with unrelated global
        # packages installed, which isn't a reliable signal) — needs a
        # proper run against a fresh `pip install -r requirements.txt`
        # before this can be trusted as a blocking gate.
        run: |
          pip install -r requirements.txt
          safety check --full-report
        continue-on-error: true
