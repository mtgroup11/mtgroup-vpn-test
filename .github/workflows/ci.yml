name: MTGroup VPN Ultimate CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx

      - name: Lint with ruff
        run: |
          ruff check backend/ telegram_bot/ --ignore E501

      - name: Type check with mypy
        run: |
          mypy backend/app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run API tests
        run: |
          pytest backend/tests/ -v --asyncio-mode=auto --tb=short -x

      - name: Run eBPF tests
        run: |
          pytest backend/tests/test_ebpf.py -v --asyncio-mode=auto --tb=short

      - name: Run Telegram bot tests
        run: |
          pytest telegram_bot/tests_bot.py -v --asyncio-mode=auto --tb=short

      - name: Test coverage report
        # Blocking (no continue-on-error): coverage on backend/ (excluding
        # cli.py — see .coveragerc — and test files themselves, which
        # previously inflated the reported percentage by counting
        # already-100%-covered test code as "coverage"). telegram_bot/ is
        # measured but not currently included in the gate threshold — its
        # test suite has a pre-existing relative-import failure unrelated
        # to this gate that needs fixing separately.
        # 58% is a safety margin below the real, currently-achieved ~61.1%
        # as of 2026-08-10 — past the original 60% target, on real
        # production-code-only measurement. Raise this number as coverage
        # improves further, never lower it.
        run: |
          pytest backend/tests/ \
            --asyncio-mode=auto \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=58

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Security scan with bandit
        # Non-blocking (informational): 10 findings remain as of
        # 2026-08-10 (down from 12 — this session fixed 2 real false
        # positives via usedforsecurity=False on the SHA1/MD5 calls used
        # for OVH signing / JA3 fingerprinting, neither a security use of
        # the hash). The rest are a mix
        # of intentional design (0.0.0.0 bind, verify=False on self-signed
        # node certs) and minor items (hardcoded /tmp paths) not triaged
        # yet — not flipping to blocking until each is explicitly
        # accepted or fixed, so this doesn't silently block unrelated PRs.
        run: |
          bandit -r backend/ telegram_bot/ -ll --skip B101
        continue-on-error: true

      - name: Check for vulnerable dependencies
        # Non-blocking: `safety check` is deprecated upstream in favour of
        # `safety scan`, and hasn't been verified against a clean venv
        # (only checked ad hoc against a dev machine with unrelated global
        # packages installed, which isn't a reliable signal) — needs a
        # proper run against a fresh `pip install -r requirements.txt`
        # before this can be trusted as a blocking gate.
        run: |
          pip install -r requirements.txt
          safety check --full-report
        continue-on-error: true
