name: MTGroup VPN Ultimate CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.14 mypy pytest pytest-asyncio pytest-cov httpx

      - name: Lint with ruff
        run: |
          ruff check backend/ telegram_bot/ agent/ --ignore E501

      - name: Type check with mypy
        run: |
          mypy backend/app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run API tests
        run: |
          set +e
          pytest backend/tests/ -v --asyncio-mode=auto --tb=short -x > /tmp/pytest_out.log 2>&1
          code=$?
          set -e
          tail -c 3000 /tmp/pytest_out.log | while IFS= read -r line; do echo "::error::$line"; done
          exit $code

      - name: Run eBPF tests
        run: |
          pytest backend/tests/test_ebpf.py -v --asyncio-mode=auto --tb=short

      - name: Run Telegram bot tests
        run: |
          pytest telegram_bot/tests_bot.py -v --asyncio-mode=auto --tb=short

      - name: Run node agent tests
        # agent/ is the remote node-side deployable (node_daemon +
        # mesh_router), separate from the master panel in backend/. Its
        # tests existed but were never run by CI — test_mesh_router.py had
        # been dead weight since it was written. Added when the node
        # daemon's command dispatcher was fixed, since that code decides
        # whether a live node keeps its config or gets wiped.
        run: |
          pytest agent/tests/ -v --asyncio-mode=auto --tb=short

      - name: Test coverage report
        # Blocking (no continue-on-error): coverage on backend/ (excluding
        # cli.py — see .coveragerc — and test files themselves, which
        # previously inflated the reported percentage by counting
        # already-100%-covered test code as "coverage"). telegram_bot/ is
        # measured but not currently included in the gate threshold — its
        # test suite has a pre-existing relative-import failure unrelated
        # to this gate that needs fixing separately.
        # 82% is a safety margin below the real, currently-achieved ~84%
        # as of 2026-08-10 (557 tests). History: 38% baseline this
        # initiative started from -> 55 -> 58 -> 62 -> 65 -> 70 -> 72 ->
        # 75 -> 76 -> 78 -> 80 -> 82 over successive sessions. The 67% -> 73%
        # jump on 2026-08-10 came from a .coveragerc fix, not new tests:
        # coverage wasn't configured to follow greenlet switches (how
        # SQLAlchemy's async ORM bridges every awaited DB call), so api/*.py
        # route handler code past its first `await db.execute(...)` was
        # invisible to the tracer despite being fully exercised by
        # test_api*.py already — see the comment in .coveragerc; do not
        # remove `concurrency = greenlet, thread` there or these numbers
        # regress silently. Real new-test coverage added the same day:
        # accounting.py 27%->91%, auto_cdn.py 0%->95%, metrics.py
        # 48%->93%, routing_engine.py 59%->90%, honeypot.py 36%->100%,
        # watchdog_client.py 30%->100%, geo_camouflage.py 33%->100%,
        # port_hopper.py 38%->96%, crypto_quantum.py 76%->84%,
        # generator_vless.py 35%->100%, generator_hysteria2.py 51%->98%,
        # generator_tuic.py 58%->100%.
        # Three real production bugs were found purely by writing these
        # tests (not by inspection) — see git log for
        # backend/app/core/accounting.py (bulk quota-suspension UPDATE
        # threw on every cycle under SQLAlchemy 2.x, silently swallowed)
        # and backend/app/core/routing_engine.py (_handle_connection's
        # finally-block read an unassigned `sni` on the timeout/empty
        # early-return paths -> UnboundLocalError -> leaked sockets on
        # every idle/timed-out probe connection). Raise this number as
        # coverage improves further, never lower it.
        run: |
          pytest backend/tests/ \
            --asyncio-mode=auto \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=82

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Security scan with bandit
        # Blocking as of 2026-08-10: 0 findings remain (down from 10).
        # Every prior finding was either fixed (the /tmp-hardcoded XDP
        # stats path moved to /run) or explicitly accepted as intentional
        # design via an inline `# nosec BXXX - reason` comment (0.0.0.0
        # binds on public-facing services, verify=False on self-signed
        # node certs backed by HMAC payload signing, the privileged
        # helper's restrictive socket chmod, the literal cls/clear shell
        # call, one test-data false positive). New findings should be
        # fixed or given the same nosec-with-reason treatment, not
        # silently reintroduced by flipping this back to non-blocking.
        run: |
          bandit -r backend/ telegram_bot/ agent/ -ll --skip B101

      - name: Check for vulnerable dependencies
        # Non-blocking: `safety check` is deprecated upstream in favour of
        # `safety scan`, and hasn't been verified against a clean venv
        # (only checked ad hoc against a dev machine with unrelated global
        # packages installed, which isn't a reliable signal) — needs a
        # proper run against a fresh `pip install -r requirements.txt`
        # before this can be trusted as a blocking gate.
        run: |
          pip install -r requirements.txt
          safety check --full-report
        continue-on-error: true
