version: '3.8'

services:
  # ── Privileged Helper ──────────────────────────────────────────────────
  # Root-owned daemon that owns iptables/nft/systemctl. vpn-backend talks to
  # it over a Unix socket (shared volume below) instead of calling these
  # tools itself — see backend/app/privileged_helper_daemon.py.
  vpn-privileged-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtgroup-privileged-helper
    restart: unless-stopped
    command: ["python", "-m", "backend.app.privileged_helper_daemon"]
    network_mode: "host"
    volumes:
      - mtgroup-helper-sock:/run/mtgroup
    environment:
      - MTG_PRIVILEGED_HELPER_SOCKET=/run/mtgroup/helper.sock
      - MTG_PANEL_USER=mtgroup
      - MTG_PANEL_GROUP=mtgroup
    cap_add:
      - NET_ADMIN
      - NET_RAW

  vpn-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtgroup-vpn-backend
    restart: unless-stopped
    depends_on:
      - vpn-privileged-helper

    # ── eBPF / XDP Network Requirements ──
    # The application still compiles and loads XDP bytecode itself (see
    # backend/app/main.py lifespan) — CAP_SYS_ADMIN/CAP_NET_ADMIN here are
    # for that BPF load/attach only. iptables/nft/systemctl calls no longer
    # happen in this container; they go through vpn-privileged-helper.
    # Moving the eBPF load/attach itself behind the helper (via pinned BPF
    # maps) is tracked as follow-up work, not done in this pass.
    network_mode: "host"

    volumes:
      # Mount kernel headers and modules for BPF compilation
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro

      # Persist SQLite DB and logs
      - ./mtgroup.db:/app/mtgroup.db
      - ./mtgroup.log:/app/mtgroup.log
      - ./audit.log:/app/audit.log

      # Shared socket to reach the privileged helper
      - mtgroup-helper-sock:/run/mtgroup

    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./mtgroup.db
      - PYTHONIOENCODING=utf-8
      - PRIVILEGED_HELPER_SOCKET=/run/mtgroup/helper.sock

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN

  vpn-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtgroup-vpn-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # vpn-backend runs with network_mode: host (see its own comment
      # above), so it isn't reachable via Docker's internal service-name
      # DNS the way a normal bridge-networked service would be — it's
      # only reachable via the host's own network. host.docker.internal
      # + extra_hosts below is the standard way to reach the host from a
      # bridge-networked container on Linux (Docker Desktop already
      # provides this DNS name; extra_hosts is what makes it resolve on
      # native Linux Docker too, since Compose v20.10+).
      # Dockerfile's CMD actually binds uvicorn to :8000 (EXPOSE 8000),
      # despite CLAUDE.md's "run locally" example using :8443 — a
      # pre-existing inconsistency, not something introduced here.
      # Override BACKEND_INTERNAL_URL if your deployment's backend
      # actually listens elsewhere.
      - BACKEND_INTERNAL_URL=http://host.docker.internal:8000
      - STEALTH_TOKEN=${STEALTH_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - vpn-backend

volumes:
  mtgroup-helper-sock:
