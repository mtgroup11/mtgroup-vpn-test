# Pins the rule set ruff lints this repo against. Without this file, ruff
# falls back to its own built-in default selection — which is NOT stable
# across ruff releases. CI installs ruff unpinned (`pip install ruff`), and
# across a handful of runs on 2026-08-13 that alone produced three
# different sets of "default" findings (UP006/UP035/UP045 pyupgrade rules
# in one run, then BLE001/RUF059/S110/I001 blind-except/bandit-alike rules
# in the next) against unchanged code — i.e. CI was flaking on ruff's own
# version-to-version default drift, not on anything in this codebase.
# This locks the selection to the same stable core (pycodestyle errors +
# pyflakes) this project has always actually been linted against, per
# CLAUDE.md and ci.yml's history — independent of whatever ruff version
# pip happens to resolve on a given run.
[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
